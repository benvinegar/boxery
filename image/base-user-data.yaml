#cloud-config
# Golden desktop image build: installs software only. Per-VM identity (keys, token, hostname) comes from
# a fresh NoCloud seed on each clone. Powers off when done.
# The software is in three layers, image/layers/{plumbing,devtools,desktop}.sh. boxery-host's build-base
# puts them (and their runner, boxery-provision) where the marker line below is; headless VMs get the
# same files at `new` and apply only plumbing + devtools (see host/backends/README.md).
hostname: boxery-base
users:
  - name: agent
    gecos: boxery agent
    groups: [sudo, adm]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
package_update: true
write_files:
  # @boxery-layers
  - path: /usr/local/sbin/boxery-build.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      /usr/local/sbin/boxery-provision plumbing devtools desktop
      google-chrome --version
      pi --version || true
      opencode --version || true
      # Prepare for cloning: fresh identity on next boot
      apt-get clean
      cloud-init clean --logs --seed || true
      truncate -s 0 /etc/machine-id
      rm -f /var/lib/dbus/machine-id /etc/ssh/ssh_host_*
      touch /var/log/boxery-build.ok
runcmd:
  # The host watches the serial port for the result: ttyS0 on x86, ttyAMA0 (PL011) on arm64 Cloud Hypervisor.
  - [bash, -c, "T=/dev/ttyS0; [ -e /dev/ttyAMA0 ] && T=/dev/ttyAMA0; /usr/local/sbin/boxery-build.sh 2>&1 | tee /var/log/boxery-build.log > $T; if [ -f /var/log/boxery-build.ok ]; then echo BOXERY_BUILD_OK > $T; else echo BOXERY_BUILD_FAILED > $T; fi"]
power_state:
  mode: poweroff
  delay: now
  timeout: 30
