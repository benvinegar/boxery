#cloud-config
# Golden image build: installs software only. Per-VM identity (keys, token, hostname)
# comes from a fresh NoCloud seed on each clone. Powers off when done.
hostname: boxery-base
users:
  - name: agent
    gecos: boxery agent
    groups: [sudo, adm]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
package_update: true
write_files:
  # Make `agent` the cloud-init default user so per-VM ssh_authorized_keys land there.
  - path: /etc/cloud/cloud.cfg.d/99-boxery.cfg
    content: |
      system_info:
        default_user:
          name: agent
          gecos: boxery agent
          groups: [sudo, adm]
          shell: /bin/bash
          sudo: "ALL=(ALL) NOPASSWD:ALL"
          lock_passwd: true
  # Guest end of the LLM proxy: 127.0.0.1:8088 in the guest -> the host proxy (path depends on the backend).
  - path: /etc/systemd/system/boxery-llm.service
    content: |
      [Unit]
      Description=boxery: forward 127.0.0.1:8088 to host LLM proxy over vsock
      After=network.target
      [Service]
      # Upstream is backend-specific (libvirt: VSOCK-CONNECT:2:8088, lima: TCP:host.lima.internal:PORT);
      # written per VM by boxery-host into /etc/boxery/proxy-upstream. Default: vsock.
      ExecStart=/bin/sh -c 'exec /usr/bin/socat TCP-LISTEN:8088,bind=127.0.0.1,reuseaddr,fork "$$(cat /etc/boxery/proxy-upstream 2>/dev/null || echo VSOCK-CONNECT:2:8088)"'
      Restart=always
      RestartSec=1
      [Install]
      WantedBy=multi-user.target
  - path: /etc/skel/.config/systemd/user/boxery-vnc.service
    content: |
      [Unit]
      Description=boxery: TigerVNC X server :1 (localhost only)
      [Service]
      ExecStart=/usr/bin/Xtigervnc :1 -localhost=1 -rfbport 5901 -SecurityTypes None -geometry 1600x1000 -depth 24 -AlwaysShared -desktop boxery
      Restart=always
      RestartSec=2
      [Install]
      WantedBy=default.target
  - path: /etc/skel/.config/systemd/user/boxery-desktop.service
    content: |
      [Unit]
      Description=boxery: XFCE session on :1
      After=boxery-vnc.service
      Requires=boxery-vnc.service
      [Service]
      Environment=DISPLAY=:1
      ExecStartPre=/bin/sh -c 'for i in $(seq 100); do [ -S /tmp/.X11-unix/X1 ] && exit 0; sleep 0.2; done; exit 1'
      ExecStart=/usr/bin/dbus-launch --exit-with-session /usr/bin/startxfce4
      Restart=always
      RestartSec=2
      [Install]
      WantedBy=default.target
  - path: /etc/skel/.config/systemd/user/boxery-novnc.service
    content: |
      [Unit]
      Description=boxery: noVNC on 127.0.0.1:6080
      After=boxery-vnc.service
      [Service]
      ExecStart=/usr/bin/websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5901
      Restart=always
      RestartSec=2
      [Install]
      WantedBy=default.target
  - path: /usr/share/novnc/index.html
    content: |
      <meta http-equiv="refresh" content="0; url=vnc.html?autoconnect=1&resize=remote&reconnect=1">
  # Ubuntu restricts user namespaces by executable path. Chrome's deb has a distro profile, but
  # Playwright's ARM64 Chromium needs its own so the browser can keep its sandbox enabled.
  - path: /etc/apparmor.d/boxery-chromium
    content: |
      abi <abi/4.0>,
      include <tunables/global>
      profile boxery-chromium /opt/boxery/browsers/chromium-*/chrome-linux*/chrome flags=(unconfined) {
        userns,
      }
  # Many parallel tool calls share one multiplexed ssh connection from the laptop.
  - path: /etc/ssh/sshd_config.d/60-boxery.conf
    content: |
      MaxSessions 64
      MaxStartups 64:30:128
  # Reduce accidental persistence of secrets (see ARCHITECTURE.md, Secrets).
  - path: /etc/sysctl.d/60-boxery.conf
    content: |
      kernel.core_pattern=|/bin/false
  - path: /etc/profile.d/boxery.sh
    content: |
      # GUI apps launched by agents show up on the shared desktop.
      export DISPLAY=${DISPLAY:-:1}
  - path: /etc/skel/.tmux.conf
    content: |
      set -g extended-keys on
      set -g mouse on
      set -g history-limit 50000
      set -g update-environment "DISPLAY SSH_AUTH_SOCK"
      set-environment -g DISPLAY :1
  - path: /usr/local/sbin/boxery-build.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get install -y --no-install-recommends \
        xfce4 xfce4-terminal xfce4-panel xfce4-session xfwm4 xfdesktop4 thunar \
        dbus-x11 x11-xserver-utils x11-utils xdotool imagemagick \
        tigervnc-standalone-server tigervnc-tools novnc websockify python3-numpy \
        fonts-dejavu-core adwaita-icon-theme-full \
        tmux git socat curl jq ripgrep fd-find build-essential python3 python3-venv zip unzip ca-certificates gnupg qemu-guest-agent apparmor
      # Firefox as a real deb (not snap)
      install -d -m 0755 /etc/apt/keyrings
      curl -fsSL https://packages.mozilla.org/apt/repo-signing-key.gpg -o /etc/apt/keyrings/packages.mozilla.org.asc
      echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" > /etc/apt/sources.list.d/mozilla.list
      printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' > /etc/apt/preferences.d/mozilla
      apt-get update && apt-get install -y firefox
      # Browser for CDP/Playwright control. amd64: Google Chrome deb. arm64 (Apple Silicon/Lima): Google
      # ships no Linux arm64 Chrome and Ubuntu's chromium is a snap, so use Playwright's Chromium build,
      # exposed as `google-chrome` (installed after node, below).
      if [ "$(dpkg --print-architecture)" = amd64 ]; then
        curl -fsSLo /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        apt-get install -y /tmp/chrome.deb && rm -f /tmp/chrome.deb
      fi
      # Node 22 LTS
      ARCH=$(dpkg --print-architecture)   # amd64 | arm64
      NODE_ARCH=$([ "$ARCH" = arm64 ] && echo arm64 || echo x64)
      NODE_TGZ=$(curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt | awk -v a="linux-$NODE_ARCH.tar.xz" '$2 ~ a"$"{print $2}')
      curl -fsSL "https://nodejs.org/dist/latest-v22.x/$NODE_TGZ" | tar -xJ -C /usr/local --strip-components=1
      node --version
      # Coding agents
      npm install -g @earendil-works/pi-coding-agent opencode-ai
      # Playwright client used by the laptop extension's vm_browser tool (talks CDP to the desktop Chrome)
      npm install --prefix /opt/boxery playwright-core
      ls /opt/boxery/node_modules/playwright-core/index.mjs
      if ! command -v google-chrome >/dev/null; then
        PLAYWRIGHT_BROWSERS_PATH=/opt/boxery/browsers node /opt/boxery/node_modules/playwright-core/cli.js install --with-deps chromium
        CH=$(ls -d /opt/boxery/browsers/chromium-*/chrome-linux*/chrome | head -1)
        printf '#!/bin/sh\nexec %s "$@"\n' "$CH" > /usr/local/bin/google-chrome && chmod +x /usr/local/bin/google-chrome
        apparmor_parser -r /etc/apparmor.d/boxery-chromium
      fi
      google-chrome --version
      pi --version || true
      opencode --version || true
      # Desktop services for the agent user
      cp -rT /etc/skel/.config /home/agent/.config
      cp /etc/skel/.tmux.conf /home/agent/.tmux.conf
      chown -R agent:agent /home/agent
      mkdir -p /var/lib/systemd/linger && touch /var/lib/systemd/linger/agent
      sudo -u agent mkdir -p /home/agent/.config/systemd/user/default.target.wants
      for s in boxery-vnc boxery-desktop boxery-novnc; do
        ln -sf /home/agent/.config/systemd/user/$s.service /home/agent/.config/systemd/user/default.target.wants/$s.service
      done
      systemctl enable boxery-llm.service qemu-guest-agent || true
      systemctl disable apport.service 2>/dev/null || true
      # Prepare for cloning: fresh identity on next boot
      apt-get clean
      cloud-init clean --logs --seed || true
      truncate -s 0 /etc/machine-id
      rm -f /var/lib/dbus/machine-id /etc/ssh/ssh_host_*
      touch /var/log/boxery-build.ok
runcmd:
  # The host watches the serial port for the result: ttyS0 on x86, ttyAMA0 (PL011) on arm64 Cloud Hypervisor.
  - [bash, -c, "T=/dev/ttyS0; [ -e /dev/ttyAMA0 ] && T=/dev/ttyAMA0; /usr/local/sbin/boxery-build.sh 2>&1 | tee /var/log/boxery-build.log > $T; if [ -f /var/log/boxery-build.ok ]; then echo BOXERY_BUILD_OK > $T; else echo BOXERY_BUILD_FAILED > $T; fi"]
power_state:
  mode: poweroff
  delay: now
  timeout: 30
