#cloud-config
# Golden image build: installs software only. Per-VM identity (keys, token, hostname)
# comes from a fresh NoCloud seed on each clone. Powers off when done.
hostname: agentvm-base
users:
  - name: agent
    gecos: agentvm agent
    groups: [sudo, adm]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
package_update: true
write_files:
  # Make `agent` the cloud-init default user so per-VM ssh_authorized_keys land there.
  - path: /etc/cloud/cloud.cfg.d/99-agentvm.cfg
    content: |
      system_info:
        default_user:
          name: agent
          gecos: agentvm agent
          groups: [sudo, adm]
          shell: /bin/bash
          sudo: "ALL=(ALL) NOPASSWD:ALL"
          lock_passwd: true
  # Guest end of the LLM proxy: 127.0.0.1:8088 -> vsock host(CID 2):8088. No network path to the host needed.
  - path: /etc/systemd/system/agentvm-llm.service
    content: |
      [Unit]
      Description=agentvm: forward 127.0.0.1:8088 to host LLM proxy over vsock
      After=network.target
      [Service]
      ExecStart=/usr/bin/socat TCP-LISTEN:8088,bind=127.0.0.1,reuseaddr,fork VSOCK-CONNECT:2:8088
      Restart=always
      RestartSec=1
      [Install]
      WantedBy=multi-user.target
  - path: /etc/skel/.config/systemd/user/agentvm-vnc.service
    content: |
      [Unit]
      Description=agentvm: TigerVNC X server :1 (localhost only)
      [Service]
      ExecStart=/usr/bin/Xtigervnc :1 -localhost=1 -rfbport 5901 -SecurityTypes None -geometry 1600x1000 -depth 24 -AlwaysShared -desktop agentvm
      Restart=always
      RestartSec=2
      [Install]
      WantedBy=default.target
  - path: /etc/skel/.config/systemd/user/agentvm-desktop.service
    content: |
      [Unit]
      Description=agentvm: XFCE session on :1
      After=agentvm-vnc.service
      Requires=agentvm-vnc.service
      [Service]
      Environment=DISPLAY=:1
      ExecStartPre=/bin/sh -c 'for i in $(seq 100); do [ -S /tmp/.X11-unix/X1 ] && exit 0; sleep 0.2; done; exit 1'
      ExecStart=/usr/bin/dbus-launch --exit-with-session /usr/bin/startxfce4
      Restart=always
      RestartSec=2
      [Install]
      WantedBy=default.target
  - path: /etc/skel/.config/systemd/user/agentvm-novnc.service
    content: |
      [Unit]
      Description=agentvm: noVNC on 127.0.0.1:6080
      After=agentvm-vnc.service
      [Service]
      ExecStart=/usr/bin/websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5901
      Restart=always
      RestartSec=2
      [Install]
      WantedBy=default.target
  - path: /usr/share/novnc/index.html
    content: |
      <meta http-equiv="refresh" content="0; url=vnc.html?autoconnect=1&resize=remote&reconnect=1">
  - path: /etc/profile.d/agentvm.sh
    content: |
      # GUI apps launched by agents show up on the shared desktop.
      export DISPLAY=${DISPLAY:-:1}
  - path: /etc/skel/.tmux.conf
    content: |
      set -g extended-keys on
      set -g mouse on
      set -g history-limit 50000
      set -g update-environment "DISPLAY SSH_AUTH_SOCK"
      set-environment -g DISPLAY :1
  - path: /usr/local/sbin/agentvm-build.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get install -y --no-install-recommends \
        xfce4 xfce4-terminal xfce4-panel xfce4-session xfwm4 xfdesktop4 thunar \
        dbus-x11 x11-xserver-utils x11-utils xdotool imagemagick \
        tigervnc-standalone-server tigervnc-tools novnc websockify python3-numpy \
        fonts-dejavu-core adwaita-icon-theme-full \
        tmux git socat curl jq ripgrep fd-find build-essential python3 python3-venv unzip ca-certificates gnupg qemu-guest-agent
      # Firefox as a real deb (not snap)
      install -d -m 0755 /etc/apt/keyrings
      curl -fsSL https://packages.mozilla.org/apt/repo-signing-key.gpg -o /etc/apt/keyrings/packages.mozilla.org.asc
      echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" > /etc/apt/sources.list.d/mozilla.list
      printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' > /etc/apt/preferences.d/mozilla
      apt-get update && apt-get install -y firefox
      # Node 22 LTS
      NODE_TGZ=$(curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt | awk '/linux-x64.tar.xz$/{print $2}')
      curl -fsSL "https://nodejs.org/dist/latest-v22.x/$NODE_TGZ" | tar -xJ -C /usr/local --strip-components=1
      node --version
      # Coding agents
      npm install -g @earendil-works/pi-coding-agent opencode-ai
      pi --version || true
      opencode --version || true
      # Desktop services for the agent user
      cp -rT /etc/skel/.config /home/agent/.config
      cp /etc/skel/.tmux.conf /home/agent/.tmux.conf
      chown -R agent:agent /home/agent
      mkdir -p /var/lib/systemd/linger && touch /var/lib/systemd/linger/agent
      sudo -u agent mkdir -p /home/agent/.config/systemd/user/default.target.wants
      for s in agentvm-vnc agentvm-desktop agentvm-novnc; do
        ln -sf /home/agent/.config/systemd/user/$s.service /home/agent/.config/systemd/user/default.target.wants/$s.service
      done
      systemctl enable agentvm-llm.service qemu-guest-agent || true
      # Prepare for cloning: fresh identity on next boot
      apt-get clean
      cloud-init clean --logs --seed || true
      truncate -s 0 /etc/machine-id
      rm -f /var/lib/dbus/machine-id /etc/ssh/ssh_host_*
      touch /var/log/agentvm-build.ok
runcmd:
  - [bash, -c, "/usr/local/sbin/agentvm-build.sh 2>&1 | tee /var/log/agentvm-build.log > /dev/ttyS0; if [ -f /var/log/agentvm-build.ok ]; then echo AGENTVM_BUILD_OK > /dev/ttyS0; else echo AGENTVM_BUILD_FAILED > /dev/ttyS0; fi"]
power_state:
  mode: poweroff
  delay: now
  timeout: 30
