<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 532" width="680" height="532" role="img" aria-labelledby="t d">
<title id="t">The boxery host: trusted, between your agent and the untrusted VMs</title>
<desc id="d">Coding agents on your machine (Claude Code, Codex, Cursor, opencode, pi) reach the boxery host over ssh. The host is trusted: it holds your real LLM keys and API tokens and runs the credential proxy, grants, leases and the shared pool, and images and forks. It creates, forks and wipes VMs on Lima, libvirt, exe.dev or boat.dev. The VMs are untrusted: they run any code and hold only a revocable per-VM token, which the host proxy swaps for your real key.</desc>
