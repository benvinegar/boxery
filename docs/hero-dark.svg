<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" width="680" height="490" role="img" aria-labelledby="t d">
<title id="t">boxery: self-serve VMs for any coding agent, on any host</title>
<desc id="d">Coding agents on your laptop (Claude Code, Codex, Cursor, opencode, pi) use boxery to spin up, fork, snapshot and throw away VMs and to run shells, code, Chrome and the full desktop inside them. The VMs can run locally on the laptop, on a remote box, or in the cloud on exe.dev.</desc>
