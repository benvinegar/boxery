<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" width="680" height="490" role="img" aria-labelledby="t d">
<title id="t">boxery: self-serve VMs for any coding agent, on any host</title>
<desc id="d">Coding agents on your machine (Claude Code, Codex, Cursor, opencode, pi) use boxery to spin up, fork, snapshot and throw away VMs and to run shells, code, Chrome and the full desktop inside them. The VMs can run locally on the same machine, on a remote box, or in the cloud on exe.dev, boat.dev and other providers. VMs are drawn as cubes: on the remote box, ci-2 and ci-3 are forks of ci-1; in the cloud, fix-a is running, fix-b has a snapshot and fix-c has been thrown away.</desc>
