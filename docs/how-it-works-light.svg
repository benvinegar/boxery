<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 550" width="680" height="550" role="img" aria-labelledby="t d">
<title id="t">How boxery works</title>
<desc id="d">Coding agents on your laptop use their own model login and drive VMs with vm_* tools; they and the boxery CLI reach the control plane over ssh. On the control plane, boxery-host creates, forks, snapshots and removes VMs on Lima, libvirt or exe.dev, holds pool leases and grants, and carries ssh to the VMs. boxery-proxy holds your real credentials for LLMs, GitHub, npm or any HTTPS API. A VM only ever sees its own token: agents running inside a VM make LLM calls through the proxy, and a VM reaches only the APIs you grant it, with the real key added by the proxy on the way out.</desc>
