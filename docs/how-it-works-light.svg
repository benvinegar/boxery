<text x="120.0" y="470.0" font-size="13" font-weight="600" fill="#085041">Lima</text>
<text x="120.0" y="490.0" font-size="12" fill="#085041">your Mac</text>
<rect x="196" y="448" width="128" height="64" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="260.0" y="470.0" font-size="13" font-weight="600" fill="#085041">libvirt</text>
<text x="260.0" y="490.0" font-size="12" fill="#085041">a KVM box</text>
<rect x="336" y="448" width="128" height="64" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="400.0" y="470.0" font-size="13" font-weight="600" fill="#085041">exe.dev</text>
<text x="400.0" y="490.0" font-size="12" fill="#085041">the cloud</text>
<rect x="500" y="384" width="140" height="150" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="570.0" y="439.0" font-size="14" font-weight="600" fill="#2C2C2A">LLM providers</text>
<text x="570.0" y="459.0" font-size="12" fill="#5F5E5A">OpenAI · Anthropic</text>
<text x="570.0" y="479.0" font-size="12" fill="#5F5E5A">ChatGPT · Ollama</text>
</g></svg>
