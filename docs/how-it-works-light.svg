<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 550" width="680" height="550" role="img" aria-labelledby="t d">
<title id="t">How boxery works</title>
<desc id="d">Coding agents and the boxery CLI on your laptop reach the control plane over ssh. On the control plane, boxery-host creates, forks, snapshots and removes VMs, holds pool leases and grants, and carries ssh to the VMs. VMs run on Lima on your Mac, libvirt on a KVM box, or exe.dev in the cloud. Agents in VMs make LLM calls with their own per-VM token; boxery-proxy checks it and swaps in your real credential before calling the provider, so keys never enter a VM.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="central">
<text x="44" y="26" text-anchor="start" font-size="13" fill="#5F5E5A">Your laptop</text>
<rect x="40" y="40" width="600" height="96" rx="16" fill="none" stroke="#888780" stroke-dasharray="5 4"/>
<rect x="56" y="56" width="220" height="64" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="166.0" y="78.0" font-size="14" font-weight="600" fill="#2C2C2A">Coding agent</text>
<text x="166.0" y="98.0" font-size="12" fill="#5F5E5A">vm_* tools via MCP or pi</text>
<rect x="288" y="56" width="160" height="64" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="368.0" y="78.0" font-size="14" font-weight="600" fill="#2C2C2A">boxery CLI</text>
<text x="368.0" y="98.0" font-size="12" fill="#5F5E5A">ssh NAME.boxery</text>
<rect x="460" y="56" width="164" height="64" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="542.0" y="78.0" font-size="14" font-weight="600" fill="#2C2C2A">Browser</text>
<text x="542.0" y="98.0" font-size="12" fill="#5F5E5A">VM desktop over noVNC</text>
<line x1="193" y1="138" x2="193" y2="216" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="205" y="163" text-anchor="start" font-size="12" fill="#5F5E5A">ssh</text>
<rect x="40" y="180" width="600" height="160" rx="14" fill="#EEEDFE" stroke="#AFA9EC"/>
<text x="56" y="198" text-anchor="start" font-size="13" font-weight="600" fill="#26215C">Control plane</text>
<text x="156" y="198" text-anchor="start" font-size="12" fill="#534AB7">any Linux box or Mac, including the laptop itself</text>
<rect x="56" y="220" width="274" height="104" rx="8" fill="#F7F6F2" stroke="#AFA9EC"/>
<text x="193.0" y="242.0" font-size="14" font-weight="600" fill="#2C2C2A">boxery-host</text>
<text x="193.0" y="262.0" font-size="12" fill="#5F5E5A">create · fork · snapshot · remove</text>
<text x="193.0" y="282.0" font-size="12" fill="#5F5E5A">pool leases · grants</text>
<text x="193.0" y="302.0" font-size="12" fill="#5F5E5A">VM ssh goes through here</text>
<rect x="350" y="220" width="274" height="104" rx="8" fill="#F7F6F2" stroke="#AFA9EC"/>
<text x="487.0" y="242.0" font-size="14" font-weight="600" fill="#2C2C2A">boxery-proxy</text>
<text x="487.0" y="262.0" font-size="12" fill="#5F5E5A">checks the VM's own token</text>
<text x="487.0" y="282.0" font-size="12" fill="#5F5E5A">swaps in your real credential</text>
<text x="487.0" y="302.0" font-size="12" fill="#5F5E5A">keys never enter a VM</text>
<line x1="193" y1="326" x2="193" y2="380" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="205" y="353" text-anchor="start" font-size="12" fill="#5F5E5A">create · copy · delete</text>
<line x1="420" y1="382" x2="420" y2="328" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="432" y="353" text-anchor="start" font-size="12" fill="#5F5E5A">LLM calls</text>
<line x1="570" y1="326" x2="570" y2="380" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="582" y="353" text-anchor="start" font-size="12" fill="#5F5E5A">real key</text>
<rect x="40" y="384" width="440" height="150" rx="12" fill="#F7F6F2" stroke="#D3D1C7"/>
<text x="260" y="406" font-size="14" font-weight="600" fill="#2C2C2A">VMs: Ubuntu 24.04, desktop or headless</text>
<text x="260" y="426" font-size="12" fill="#5F5E5A">shell · files · Chrome · the full desktop</text>
