<text x="542.0" y="78.0" font-size="14" font-weight="600" fill="#2C2C2A">Browser</text>
<text x="542.0" y="98.0" font-size="12" fill="#5F5E5A">VM desktop over noVNC</text>
<line x1="193" y1="138" x2="193" y2="216" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
