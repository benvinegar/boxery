<text x="570.0" y="439.0" font-size="14" font-weight="600" fill="#F1EFE8">LLM providers</text>
<text x="570.0" y="459.0" font-size="12" fill="#B4B2A9">OpenAI · Anthropic</text>
<text x="570.0" y="479.0" font-size="12" fill="#B4B2A9">ChatGPT · Ollama</text>
</g></svg>
