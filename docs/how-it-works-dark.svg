<rect x="56" y="56" width="220" height="64" rx="8" fill="#2C2C2A" stroke="#5F5E5A"/>
<text x="166.0" y="78.0" font-size="14" font-weight="600" fill="#F1EFE8">Coding agent</text>
<text x="166.0" y="98.0" font-size="12" fill="#B4B2A9">vm_* tools via MCP or pi</text>
<rect x="288" y="56" width="160" height="64" rx="8" fill="#2C2C2A" stroke="#5F5E5A"/>
<text x="368.0" y="78.0" font-size="14" font-weight="600" fill="#F1EFE8">boxery CLI</text>
<text x="368.0" y="98.0" font-size="12" fill="#B4B2A9">ssh NAME.boxery</text>
<rect x="460" y="56" width="164" height="64" rx="8" fill="#2C2C2A" stroke="#5F5E5A"/>
<text x="542.0" y="78.0" font-size="14" font-weight="600" fill="#F1EFE8">Browser</text>
<text x="542.0" y="98.0" font-size="12" fill="#B4B2A9">VM desktop over noVNC</text>
<line x1="193" y1="138" x2="193" y2="216" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="205" y="163" text-anchor="start" font-size="12" fill="#B4B2A9">ssh</text>
<rect x="40" y="180" width="600" height="160" rx="14" fill="#26215C" stroke="#534AB7"/>
<text x="56" y="198" text-anchor="start" font-size="13" font-weight="600" fill="#EEEDFE">Control plane</text>
<text x="156" y="198" text-anchor="start" font-size="12" fill="#CECBF6">any Linux box or Mac, including the laptop itself</text>
<rect x="56" y="220" width="274" height="104" rx="8" fill="#1C1C1B" stroke="#534AB7"/>
<text x="193.0" y="242.0" font-size="14" font-weight="600" fill="#F1EFE8">boxery-host</text>
<text x="193.0" y="262.0" font-size="12" fill="#B4B2A9">create · fork · snapshot · remove</text>
<text x="193.0" y="282.0" font-size="12" fill="#B4B2A9">pool leases · grants</text>
<text x="193.0" y="302.0" font-size="12" fill="#B4B2A9">VM ssh goes through here</text>
<rect x="350" y="220" width="274" height="104" rx="8" fill="#1C1C1B" stroke="#534AB7"/>
<text x="487.0" y="242.0" font-size="14" font-weight="600" fill="#F1EFE8">boxery-proxy</text>
<text x="487.0" y="262.0" font-size="12" fill="#B4B2A9">checks the VM's own token</text>
<text x="487.0" y="282.0" font-size="12" fill="#B4B2A9">swaps in your real credential</text>
<text x="487.0" y="302.0" font-size="12" fill="#B4B2A9">keys never enter a VM</text>
<line x1="193" y1="326" x2="193" y2="380" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="205" y="353" text-anchor="start" font-size="12" fill="#B4B2A9">create · copy · delete</text>
<line x1="420" y1="382" x2="420" y2="328" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="432" y="353" text-anchor="start" font-size="12" fill="#B4B2A9">LLM calls</text>
<line x1="570" y1="326" x2="570" y2="380" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
