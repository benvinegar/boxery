<rect x="196" y="448" width="128" height="64" rx="6" fill="#04342C" stroke="#0F6E56"/>
<text x="260.0" y="470.0" font-size="13" font-weight="600" fill="#9FE1CB">libvirt</text>
<text x="260.0" y="490.0" font-size="12" fill="#9FE1CB">a KVM box</text>
