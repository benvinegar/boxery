<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 550" width="680" height="550" role="img" aria-labelledby="t d">
<title id="t">How boxery works</title>
<desc id="d">Coding agents and the boxery CLI on your laptop reach the control plane over ssh. On the control plane, boxery-host creates, forks, snapshots and removes VMs, holds pool leases and grants, and carries ssh to the VMs. VMs run on Lima on your Mac, libvirt on a KVM box, or exe.dev in the cloud. Agents in VMs make LLM calls with their own per-VM token; boxery-proxy checks it and swaps in your real credential before calling the provider, so keys never enter a VM.</desc>
