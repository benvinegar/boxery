<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="t d">
<title id="t">Shared pool leases</title>
<desc id="d">A pool VM is free at its clean image. An agent acquires it and gets an exclusive lease with its own ssh key, renewed while the session is in use. On release or expiry the VM is reimaged from its clean image in about 9 seconds and goes back to the pool with the last holder's key and work gone. If a laptop sleeps or an agent crashes, the lease stops renewing and the host's reaper resets the VM when it expires.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="central">
<rect x="40" y="70" width="150" height="90" rx="8" fill="#04342C" stroke="#0F6E56"/>
<text x="115.0" y="95.0" font-size="14" font-weight="600" fill="#9FE1CB">Free</text>
<text x="115.0" y="115.0" font-size="12" fill="#9FE1CB">at its clean image</text>
<text x="115.0" y="135.0" font-size="12" fill="#9FE1CB">ready to lease</text>
<rect x="265" y="70" width="150" height="90" rx="8" fill="#26215C" stroke="#534AB7"/>
<text x="340.0" y="95.0" font-size="14" font-weight="600" fill="#EEEDFE">Leased</text>
<text x="340.0" y="115.0" font-size="12" fill="#CECBF6">its own ssh key</text>
<text x="340.0" y="135.0" font-size="12" fill="#CECBF6">renewed while in use</text>
<rect x="490" y="70" width="150" height="90" rx="8" fill="#2C2C2A" stroke="#5F5E5A"/>
<text x="565.0" y="95.0" font-size="14" font-weight="600" fill="#F1EFE8">Reset</text>
<text x="565.0" y="115.0" font-size="12" fill="#B4B2A9">reimaged from clean</text>
<text x="565.0" y="135.0" font-size="12" fill="#B4B2A9">about 9 s</text>
<line x1="192" y1="120" x2="263" y2="120" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="228" y="104" font-size="12" fill="#B4B2A9">acquire</text>
<line x1="417" y1="120" x2="488" y2="120" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="453" y="91" font-size="12" fill="#B4B2A9">release</text>
<text x="453" y="105" font-size="12" fill="#B4B2A9">or expiry</text>
<path d="M565 162 V200 Q565 208 557 208 H123 Q115 208 115 200 V164" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="340" y="224" font-size="12" fill="#B4B2A9">back in the pool, with the last holder's key and work gone</text>
<text x="340" y="30" font-size="13" fill="#B4B2A9">One pool VM's lease cycle</text>
<text x="340" y="258" font-size="12" fill="#B4B2A9">A laptop that sleeps or an agent that crashes stops renewing its lease.</text>
<text x="340" y="276" font-size="12" fill="#B4B2A9">The host's reaper resets the VM when the lease expires, so nothing is stranded.</text>
</g></svg>
