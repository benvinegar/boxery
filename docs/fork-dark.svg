<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img" aria-labelledby="t d">
<title id="t">Forking a running VM</title>
<desc id="d">A running VM, demo, is captured into a disk-only image, demo@fork-1 (about a second on libvirt, without pausing it). Three new VMs, try-a, try-b and try-c, boot from that image in parallel. The agent tries a different fix in each and keeps the one that worked; the others are removed. Each copy boots with its own ssh keys, proxy token, hostname and machine-id.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="central">
<text x="115" y="24" font-size="13" fill="#B4B2A9">Running VM</text>
<text x="325" y="24" font-size="13" fill="#B4B2A9">Capture</text>
<text x="555" y="24" font-size="13" fill="#B4B2A9">Fork into new VMs</text>
<rect x="40" y="100" width="150" height="74" rx="8" fill="#04342C" stroke="#0F6E56"/>
<text x="115.0" y="127.0" font-size="14" font-weight="600" fill="#9FE1CB">demo</text>
<text x="115.0" y="147.0" font-size="12" fill="#9FE1CB">running, mid-task</text>
<line x1="192" y1="137" x2="248" y2="137" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="220" y="123" font-size="12" fill="#B4B2A9">~1 s</text>
<text x="220" y="151" font-size="11" fill="#B4B2A9">libvirt</text>
<rect x="250" y="100" width="150" height="74" rx="8" fill="#26215C" stroke="#534AB7"/>
<text x="325.0" y="127.0" font-size="14" font-weight="600" fill="#EEEDFE">demo@fork-1</text>
<text x="325.0" y="147.0" font-size="12" fill="#CECBF6">disk only, no RAM</text>
<path d="M402 137 C434 137 434 67 466 67" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="470" y="40" width="170" height="54" rx="8" fill="#1C1C1B" stroke="#444441" stroke-dasharray="4 3"/>
<text x="555.0" y="58.0" font-size="13" font-weight="600" fill="#F1EFE8">try-a</text>
<text x="555.0" y="76.0" font-size="12" fill="#B4B2A9">didn't work · removed</text>
<path d="M402 137 C434 137 434 137 466 137" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="470" y="110" width="170" height="54" rx="8" fill="#04342C" stroke="#0F6E56"/>
<text x="555.0" y="128.0" font-size="13" font-weight="600" fill="#9FE1CB">try-b</text>
<text x="555.0" y="146.0" font-size="12" fill="#9FE1CB">worked · kept</text>
<path d="M402 137 C434 137 434 207 466 207" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="470" y="180" width="170" height="54" rx="8" fill="#1C1C1B" stroke="#444441" stroke-dasharray="4 3"/>
<text x="555.0" y="198.0" font-size="13" font-weight="600" fill="#F1EFE8">try-c</text>
<text x="555.0" y="216.0" font-size="12" fill="#B4B2A9">didn't work · removed</text>
<text x="340" y="266" font-size="12" fill="#B4B2A9">Each copy boots with its own identity: ssh keys, proxy token, hostname and machine-id.</text>
</g></svg>
